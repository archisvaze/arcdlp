name: Release builds

# Builds the Windows installer, Linux AppImage and macOS dmg (Apple Silicon) on GitHub-hosted runners.
# Pushing a v* tag also creates a draft release with all three files, using release_notes.md as the body.
# The Mac app is ad-hoc signed by the afterPack hook (scripts/after-pack.js). It is not notarized.
# Windows signing runs once the SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret exist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*-Setup-*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: arcdlp
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: dist/signed/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        run: npx electron-builder --linux --x64 --publish never

      # Repack with the static AppImage runtime (no libfuse2 needed) and embed update info for .zsync delta updates
      - name: Repack AppImage
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q zsync libfuse2
          cd dist
          APPIMAGE=$(ls ArcDLP-*.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract > /dev/null
          rm "$APPIMAGE"
          # The extracted tree is mode 0700 and appimagetool refuses to package that.
          # a+rX opens it up for all users without marking plain files executable.
          chmod -R a+rX squashfs-root
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run -n \
            -u "gh-releases-zsync|archisvaze|arcdlp|latest|ArcDLP-*.AppImage.zsync" \
            squashfs-root "$APPIMAGE"
          ls -la ArcDLP-*

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/ArcDLP-*.AppImage
            dist/ArcDLP-*.AppImage.zsync
          if-no-files-found: error

  mac:
    # Apple Silicon (M1) runner, so npm ci fetches the arm64 Deno and ffmpeg and the universal yt-dlp_macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dmg
        run: npx electron-builder --mac --arm64 --publish never

      # Opens the dmg the way users get it, then checks the signature and that every bundled tool runs
      - name: Verify the app inside the dmg
        run: |
          set -euo pipefail
          DMG=$(ls dist/ArcDLP-*-arm64.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          APP="$MNT/ArcDLP.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/Resources/bin/yt-dlp" --version
          "$APP/Contents/Resources/bin/deno" --version
          "$APP/Contents/Resources/ffmpeg-static/ffmpeg" -version > /dev/null
          echo "ffmpeg runs"
          # Only a warning: the app still works, it would just be bigger than it needs to be
          if [ -e "$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg" ]; then
            echo "::warning::A second ffmpeg copy is still bundled in app.asar.unpacked (check the files excludes in package.json)"
          fi
          du -sh "$APP"
          hdiutil detach "$MNT" || hdiutil detach -force "$MNT"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/ArcDLP-*-arm64.dmg
          if-no-files-found: error

  release:
    needs: [windows, linux, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          set -euo pipefail
          mkdir upload
          if ls artifacts/windows-signed/*.exe > /dev/null 2>&1; then
            cp artifacts/windows-signed/*.exe upload/
          else
            cp artifacts/windows-unsigned/*.exe upload/
          fi
          cp artifacts/linux/* upload/
          cp artifacts/mac/*.dmg upload/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release_notes.md
          files: upload/*
